app-id: io.github.tusharkumarcodes.FolioAI
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: folio-ai

finish-args:
  # Display and Wayland / X11 rendering
  - --socket=wayland
  - --socket=fallback-x11
  # Audio/Notifications if needed
  - --share=ipc
  # Access local or remote Ollama instances
  - --share=network
  # Persist chat and note sessions
  - --filesystem=xdg-data/gtk_note_app:create

build-options:
  env:
    PYTHONPATH: /app/lib/python3.12/site-packages

modules:
  # Python Markdown dependency
  - name: python3-markdown
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} markdown
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d6/f6/433f443886eb02d3814324b3003b719121953457209e99f772145b3791a4/Markdown-3.7-py3-none-any.whl
        sha256: 7d6c6b24d787034ff9d71c49cc394747eb1a2386c1dddf6f97efd9396e62678f

  # Application Module
  - name: folio-ai
    buildsystem: meson
    sources:
      - type: dir
        path: .
